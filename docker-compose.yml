name: shopkit

# Host ports are offset from notifyr's compose so both stacks can run side by side.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shopkit
      POSTGRES_PASSWORD: shopkit
      POSTGRES_DB: shopkit
    ports:
      - "5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
